<!DOCTYPE html>
<html lang="es">

<style>
  :root{
    --bg:#f6f5f2; --card:#ffffff; --ink:#1f2328; --muted:#6b7078; --line:#e4e2dc;
    --accent:#1f6f6b; --accent-soft:#e3f0ee; --warn:#b4561b; --warn-soft:#fbeee4;
    --bad:#a8322d; --bad-soft:#f8e4e2; --ok:#2e7d4f; --ok-soft:#e3f2e8;
    --en:#2b5fa8; --fr:#7a3fa0; --it:#2e7d4f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  .marca{font-weight:700;font-size:18px}
  .marca small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
  nav{display:flex;gap:6px;flex:1}
  nav button{background:none;border:1px solid transparent;padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer;color:var(--muted)}
  nav button.activo{background:var(--accent-soft);color:var(--accent);font-weight:600}
  nav button:hover{color:var(--ink)}
  .hoy{color:var(--muted);font-size:13px}
  main{max-width:1180px;margin:0 auto;padding:24px}
  h2{font-size:18px;margin:0 0 12px}
  h3{font-size:15px;margin:0 0 10px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .kpi .etq{color:var(--muted);font-size:13px}
  .kpi .valor{font-size:28px;font-weight:700;margin:4px 0}
  .kpi .det{font-size:13px;color:var(--muted)}
  .barra{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
  .barra span{display:block;height:100%;background:var(--accent)}
  .cols{display:grid;grid-template-columns:3fr 2fr;gap:16px}
  @media(max-width:860px){.cols{grid-template-columns:1fr}}
  .tarea{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .tarea:first-of-type{border-top:none}
  .tarea .info{flex:1}
  .tarea .nom{font-weight:600;cursor:pointer}
  .tarea .nom:hover{text-decoration:underline}
  .tarea .txt{font-size:13px;color:var(--muted)}
  .chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
  .c-Cobro{background:var(--bad-soft);color:var(--bad)}
  .c-Riesgo{background:var(--warn-soft);color:var(--warn)}
  .c-Seguimiento{background:var(--accent-soft);color:var(--accent)}
  .c-Examen{background:#ece8f6;color:#5b3f99}
  .c-Agenda{background:#eef0f3;color:var(--muted)}
  .e-activo{background:var(--ok-soft);color:var(--ok)}
  .e-interesado{background:var(--accent-soft);color:var(--accent)}
  .e-baja{background:#eef0f3;color:var(--muted)}
  .e-perdido{background:#f3ecec;color:#8a5a5a}
  .i-Inglés{color:var(--en)} .i-Francés{color:var(--fr)} .i-Italiano{color:var(--it)}
  button.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
  button.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  button.btn.peligro{background:var(--bad)}
  button.btn:hover{opacity:.9}
  .filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .filtros input{flex:1;min-width:220px}
  table{width:100%;border-collapse:collapse;background:var(--card)}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
  th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#faf9f6}
  .tabla-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto}
  .vacio{color:var(--muted);padding:12px 0;font-size:14px}
  .mini{display:flex;align-items:flex-end;gap:14px;height:120px;margin-top:10px}
  .mini div{flex:1;text-align:center;font-size:12px;color:var(--muted)}
  .mini .col{background:var(--accent);border-radius:6px 6px 0 0;margin:0 auto 6px;width:60%}
  .lista-baja li{margin-bottom:6px;font-size:14px}
  .lista-baja{padding-left:18px;margin:0}

  .ficha{background:var(--card);border-radius:14px;width:100%;max-width:880px;padding:22px}
  .ficha-cab{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .ficha-cab h2{margin:0;flex:1}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .grid label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
  .grid .ancho{grid-column:1/-1}
  .seccion{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
  .fila-acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .hist{list-style:none;padding:0;margin:0}
  .hist li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:12px}
  .hist .f{color:var(--muted);width:96px;flex-shrink:0}
  .hist .t{font-weight:600;width:120px;flex-shrink:0}
  .aviso{font-size:12px;color:var(--muted);text-align:center;padding:20px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}

  .cab-vista{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
  .cab-vista h2{margin:0}
  .kpis3{grid-template-columns:repeat(3,1fr)}

  .obj{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:10px}
  .obj b{color:var(--ink)} .obj b.ok{color:var(--ok)} .obj b.ko{color:var(--bad)}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  @media(max-width:860px){.cols2{grid-template-columns:1fr}}

  .gcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .gval{font-size:11px;color:var(--muted);margin-bottom:3px;text-align:center;background:var(--card);position:relative;z-index:2;padding:0 3px;border-radius:3px}
  .gmes{font-size:12px;color:var(--muted);margin-top:6px;height:16px}
  .gmes.actual{color:var(--ink);font-weight:700}
  .pila{width:70%;display:flex;flex-direction:column;border-radius:5px 5px 0 0;overflow:hidden}
  .pila span{display:block;width:100%}
  .linea-obj{position:absolute;left:0;right:0;border-top:2px dashed var(--warn);z-index:1;pointer-events:none}
  .par{display:flex;align-items:flex-end;gap:4px;width:80%;justify-content:center}

  .par span{display:block;width:100%;border-radius:4px 4px 0 0;min-height:2px}

  a.wa svg{width:15px;height:15px;fill:#fff}

  .grupo .hor{color:var(--muted);font-size:13px;margin-bottom:10px}

  .nombres span{font-size:12px;background:#f1efea;border-radius:10px;padding:3px 8px;cursor:pointer}
  .nombres span.int{background:var(--accent-soft);color:var(--accent)}
  .nombres span:hover{text-decoration:underline}
  .origen{margin-top:4px}
  .origen .fila{margin-bottom:12px}
  .origen .cab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .origen .doble{position:relative;height:14px;background:var(--line);border-radius:4px;overflow:hidden}
  .origen .doble .l{position:absolute;left:0;top:0;bottom:0;background:#b9d8d4}
  .origen .doble .m{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
  .leyenda{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:12px}
  .leyenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

function emailDe(nombre){
  const p = nombre.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().split(' ');
  return p[0]+'.'+p[1]+'@correo-ficticio.es';
}

function crearDatosDemo(){
  const db = {version:VERSION_DATOS, seq:1, alumnos:[], pagos:[], contactos:[], hechas:[]};
  const nid = () => db.seq++;
  SEMILLA.forEach((r,i) => {
    const [nombre,telefono,idioma,nivel,modalidad,horario,cuota,estado,objetivo,origen,altaOff,faltas,examen,extra] = r;
    const a = {id:nid(), nombre, telefono, email:emailDe(nombre), idioma, nivel, modalidad, horario, cuota, estado, objetivo, origen,
      alta: altaOff!=null ? dia(altaOff) : '', faltas, examen: examen ? {nombre:examen[0], fecha:dia(examen[1])} : {nombre:'',fecha:''},
      fechaBaja: extra && extra.baja!=null ? dia(extra.baja) : '', motivoBaja: extra && extra.motivo || '', notas:''};
    db.alumnos.push(a);
    const c = (off,tipo,nota) => db.contactos.push({id:nid(), alumnoId:a.id, fecha:dia(off), tipo, nota});

    if(estado==='perdido'){
      const fin = (extra.prueba!=null ? extra.prueba : extra.contacto) + 4;
      a.fechaBaja = dia(fin); a.motivoBaja = extra.motivo;
      c(extra.contacto, 'Pide información', CANAL_TXT[origen]);
      if(extra.prueba!=null) c(extra.prueba, 'Clase de prueba', 'Asiste a la clase de prueba de '+idioma+' '+nivel);
      c(fin, 'Llamada', 'No se matricula. Motivo: '+extra.motivo);
      return;
    }
    if(estado==='interesado'){
      c(extra.prueba-6, 'Pide información', CANAL_TXT[origen]+'. Se agenda clase de prueba');
      c(extra.prueba, 'Clase de prueba', extra.prueba<=0 ? 'Asiste a la clase de prueba de '+idioma+' '+nivel : 'Clase de prueba programada');
      return;
    }
    // Alumnos matriculados (activos o ya dados de baja)
    c(altaOff-8-(i%5), 'Pide información', CANAL_TXT[origen]);
    if(modalidad==='Grupo' || i%2===0) c(altaOff-4, 'Clase de prueba', 'Clase de prueba antes de matricularse');
    c(altaOff, 'Prueba de nivel', 'Prueba de nivel: entra en '+nivel);
    if(estado==='activo') c(-((i*7)%40)-3, 'WhatsApp', 'Recordatorio de horario y material del mes');
    if(estado==='baja') c(extra.baja, 'Llamada', 'Comunica la baja. Motivo: '+extra.motivo);

    // Pagos de los últimos 6 meses
    const limite = estado==='baja' ? aFecha(dia(extra.baja)) : null;
    for(let m=-5; m<=0; m++){
      const k = mesKey(m);
      const inicioMes = aFecha(k+'-01');
      const finMes = new Date(inicioMes.getFullYear(), inicioMes.getMonth()+1, 0);
      if(aFecha(a.alta) > finMes) continue;
      if(limite && limite < inicioMes) continue;
      const pend = (IMPAGOS[nombre]||[]).includes(m);
      db.pagos.push({id:nid(), alumnoId:a.id, mes:k, importe:cuota, estado: pend?'pendiente':'pagado'});
    }
  });
  const andres = db.alumnos.find(a=>a.nombre==='Andrés Navarro Gil');
  db.contactos.push({id:nid(), alumnoId:andres.id, fecha:dia(-10), tipo:'Email', nota:'Aviso de recibo devuelto del mes anterior'});
  return db;
}

/* ================== Lógica de negocio ================== */
const alumno = id => db.alumnos.find(a=>a.id===id);
const contactosDe = id => db.contactos.filter(c=>c.alumnoId===id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
const pagosDe = id => db.pagos.filter(p=>p.alumnoId===id).sort((a,b)=>b.mes.localeCompare(a.mes));
const ultimoContacto = id => contactosDe(id).find(c=>c.fecha<=hoyISO);
const ultimaPrueba = id => contactosDe(id).find(c=>c.tipo==='Clase de prueba');

function tareas(){
  const t = [], mesAct = mesKey(0);
  db.pagos.filter(p=>p.estado==='pendiente').forEach(p=>{
    const a = alumno(p.alumnoId); if(!a) return;
    const mesTxt = fmtMes(p.mes).split(' ')[0].toLowerCase();
    t.push({id:'pago-'+p.id, tipo:'Cobro', prio:p.mes<mesAct?0:2, a, texto:'Recibo de '+fmtMes(p.mes).toLowerCase()+' sin cobrar ('+eur(p.importe)+')', accion:'pagar', pagoId:p.id,
      msg:`Hola ${nombrePila(a)}, te escribimos de Trilingua. Te recordamos que el recibo de ${mesTxt} (${eur(p.importe)}) está pendiente. Puedes pagarlo en recepción o por Bizum. ¡Gracias!`});
  });
  db.alumnos.forEach(a=>{
    if(a.estado==='interesado'){
      const pr = ultimaPrueba(a.id);
      if(pr){
        const d = diasDesde(pr.fecha);
        const despues = db.contactos.some(c=>c.alumnoId===a.id && c.fecha>pr.fecha);
        if(d>=3 && !despues) t.push({id:'prueba-'+a.id+'-'+pr.fecha, tipo:'Seguimiento', prio:1, a, texto:'Hizo la clase de prueba hace '+d+' días y no se ha matriculado. Llamar', accion:'hecho',
          msg:`Hola ${nombrePila(a)}, soy de Trilingua. ¿Qué tal te fue la clase de prueba de ${a.idioma.toLowerCase()}? Si te encajó, te guardamos plaza en el grupo de ${a.horario}.`});
        else if(d<=0 && d>=-7) t.push({id:'agenda-'+a.id+'-'+pr.fecha, tipo:'Agenda', prio:4, a, texto: d===0?'Clase de prueba hoy':'Clase de prueba en '+(-d)+(d===-1?' día':' días'), accion:null,
          msg:`Hola ${nombrePila(a)}, te recordamos tu clase de prueba de ${a.idioma.toLowerCase()} en Trilingua el ${fmtFecha(pr.fecha)}. ¡Te esperamos!`});
      }
    }
    if(a.estado==='activo'){
      if(a.faltas>=3) t.push({id:'faltas-'+a.id+'-'+a.faltas, tipo:'Riesgo', prio:1, a, texto:a.faltas+' faltas seguidas. Riesgo de baja: llamar', accion:'hecho',
        msg:`Hola ${nombrePila(a)}, te hemos echado de menos en las últimas clases de ${a.idioma.toLowerCase()}. ¿Va todo bien? Si te viene mejor otro horario, te buscamos hueco.`});
      if(a.examen && a.examen.fecha){
        const d = -diasDesde(a.examen.fecha);
        if(d>=0 && d<=30) t.push({id:'examen-'+a.id+'-'+a.examen.fecha, tipo:'Examen', prio:3, a, texto:a.examen.nombre+' en '+d+' días: confirmar inscripción y hacer simulacro', accion:'hecho',
          msg:`Hola ${nombrePila(a)}, quedan ${d} días para el ${a.examen.nombre}. ¿Has hecho ya la inscripción? Esta semana hacemos un simulacro en clase.`});
      }
    }
  });
  return t.filter(x=>!db.hechas.includes(x.id)).sort((x,y)=>x.prio-y.prio);
}

const METAS = {ingresosMes:4000, activos:50, altasMes:4, conversion:50, bajasMax:2, ocupacion:75};

/* ================== Métricas ================== */
const finDeMes = k => { const [y,m]=k.split('-').map(Number); return iso(new Date(y,m,0)); };
const nombreMes = k => fmtMes(k).split(' ')[0];
function fechaInfo(a){
  const cs = db.contactos.filter(c=>c.alumnoId===a.id).sort((x,y)=>x.fecha.localeCompare(y.fecha));
  const info = cs.find(c=>c.tipo==='Pide información');
  return (info || cs[0] || {}).fecha || a.alta || '';
}
const hizoPrueba = a => db.contactos.some(c=>c.alumnoId===a.id && c.tipo==='Clase de prueba' && c.fecha<=hoyISO);
const matriculado = a => a.estado==='activo' || a.estado==='baja';
function activosAl(fecha){
  return db.alumnos.filter(a=>a.alta && a.alta<=fecha && (a.estado==='activo' || (a.estado==='baja' && a.fechaBaja>fecha))).length;
}
const ingresosMes = k => { const ps=db.pagos.filter(p=>p.mes===k); return {previsto:ps.reduce((s,p)=>s+p.importe,0), cobrado:ps.filter(p=>p.estado==='pagado').reduce((s,p)=>s+p.importe,0)}; };
const altasMes = k => db.alumnos.filter(a=>matriculado(a) && a.alta && a.alta.startsWith(k)).length;
const bajasMes = k => db.alumnos.filter(a=>a.estado==='baja' && a.fechaBaja && a.fechaBaja.startsWith(k)).length;
function conversionEntre(desde, hasta){
  const leads = db.alumnos.filter(a=>{ const f=fechaInfo(a); return f && f>=desde && f<=hasta; });
  const conv = leads.filter(matriculado).length;
  return {leads:leads.length, conv, pct: leads.length ? Math.round(conv/leads.length*100) : 0};
}
function ocupacion(){
  const g = {};
  db.alumnos.filter(a=>a.modalidad==='Grupo' && a.estado==='activo').forEach(a=>{ const k=a.idioma+'|'+a.nivel+'|'+a.horario; g[k]=(g[k]||0)+1; });
  db.alumnos.filter(a=>a.modalidad==='Grupo' && a.estado==='interesado').forEach(a=>{ const k=a.idioma+'|'+a.nivel+'|'+a.horario; if(!(k in g)) g[k]=0; });
  const grupos = Object.keys(g).length, ocupadas = Object.values(g).reduce((s,n)=>s+n,0), plazas = grupos*PLAZAS_GRUPO;
  return {grupos, ocupadas, plazas, pct: plazas ? Math.round(ocupadas/plazas*100) : 0};
}

/* ================== Panel (dashboard) ================== */
function deltaHTML(actual, anterior, etiqueta, menosEsMejor, enPuntos){
  const d = actual - anterior;
  if(d===0) return `<div class="delta igual">= que ${etiqueta}</div>`;
  const bueno = menosEsMejor ? d<0 : d>0;
  const txt = enPuntos ? Math.abs(d)+' pts' : (anterior ? Math.abs(Math.round(d/anterior*100))+' %' : Math.abs(d));
  return `<div class="delta ${bueno?'bien':'mal'}">${d>0?'▲':'▼'} ${txt} vs ${etiqueta}</div>`;
}
function objetivoHTML(valor, objetivo, texto, menosEsMejor){
  if(menosEsMejor){
    const ok = valor<=objetivo;
    return `<div class="obj"><span>Objetivo: ${texto}</span><b class="${ok?'ok':'ko'}">${ok?'Cumplido':'Superado'}</b></div>`;
  }
  const pct = objetivo ? Math.round(valor/objetivo*100) : 0;
  return `<div class="obj"><span>Objetivo: ${texto}</span><b class="${pct>=100?'ok':''}">${pct} %</b></div>
    <div class="barra ${pct>=100?'lleno':pct>=75?'medio':'bajo'}"><span style="width:${Math.min(pct,100)}%"></span></div>`;
}
function kpi(etq, valor, sub, delta, obj){
  return `<div class="card kpi"><div class="etq">${etq}</div><div class="valor">${valor}</div>${delta||''}${sub?`<div class="det">${sub}</div>`:''}${obj||''}</div>`;
}

/* ================== Captación (embudo) ================== */
const PERIODOS = {mes:'Este mes', '3m':'Últimos 3 meses', '12m':'Últimos 12 meses', todo:'Todo el histórico'};
function desdePeriodo(p){ return p==='mes' ? mesKey(0)+'-01' : p==='3m' ? dia(-90) : p==='12m' ? dia(-365) : '0000-00-00'; }

function vistaCaptacion(){
  const p = ui.periodo || '12m', canal = ui.canal || '';
  const desde = desdePeriodo(p);
  const enPeriodo = db.alumnos.filter(a=>{ const f=fechaInfo(a); return f && f>=desde && f<=hoyISO; });
  const leads = enPeriodo.filter(a=>!canal || a.origen===canal);
  const conPrueba = leads.filter(hizoPrueba), matric = leads.filter(matriculado), activos = leads.filter(a=>a.estado==='activo');
  const enCurso = leads.filter(a=>a.estado==='interesado'), perdidos = leads.filter(a=>a.estado==='perdido');
  const sinPrueba = matric.filter(a=>!hizoPrueba(a)).length;
  const pctDe = (n,t) => t ? Math.round(n/t*100) : 0;
  const etapas = [
    ['Pidieron información', leads.length, ''],
    ['Hicieron la clase de prueba', conPrueba.length, pctDe(conPrueba.length, leads.length)+' % de los que pidieron información'],
    ['Se matricularon', matric.length, pctDe(matric.length, leads.length)+' % de los que pidieron información'+(sinPrueba?` · ${sinPrueba} sin clase de prueba`:'')],
    ['Siguen activos hoy', activos.length, pctDe(activos.length, matric.length)+' % de los matriculados'],
  ];
  const max = Math.max(1, leads.length);
  const motivos = {}; perdidos.forEach(a=>motivos[a.motivoBaja]=(motivos[a.motivoBaja]||0)+1);
  const motivosOrd = Object.entries(motivos).sort((a,b)=>b[1]-a[1]);
  const maxMot = Math.max(1, ...motivosOrd.map(m=>m[1]));
  const porCanal = ORIGENES.map(o=>{ const l=enPeriodo.filter(a=>a.origen===o);
    return {o, l:l.length, pr:l.filter(hizoPrueba).length, m:l.filter(matriculado).length, eur:l.filter(a=>a.estado==='activo').reduce((s,a)=>s+a.cuota,0)}; }).sort((a,b)=>b.l-a.l);
  const opt = (obj,val) => Object.entries(obj).map(([k,v])=>`<option value="${k}" ${k===val?'selected':''}>${v}</option>`).join('');
  const solMes = [-5,-4,-3,-2,-1,0].map(mesKey).map(k=>{ const l=db.alumnos.filter(a=>(!canal||a.origen===canal) && fechaInfo(a).startsWith(k)); return {k, n:l.length, m:l.filter(matriculado).length}; });
  const maxSol = Math.max(1, ...solMes.map(x=>x.n));
  const interes = db.alumnos.filter(a=>a.estado==='interesado').sort((a,b)=>fechaInfo(b).localeCompare(fechaInfo(a)));

  return `
  <div class="cab-vista"><h2>Captación de alumnos</h2>
    <div class="filtros" style="margin:0">
      <select onchange="ui.periodo=this.value;render()">${opt(PERIODOS,p)}</select>
      <select onchange="ui.canal=this.value;render()"><option value="">Todos los canales</option>${ORIGENES.map(o=>`<option ${o===canal?'selected':''}>${o}</option>`).join('')}</select>
    </div></div>
  <div class="cols">
    <div class="card">
      <h3>Embudo: de la solicitud de información a la matrícula</h3>
      <div class="embudo">${etapas.map(([t,n,sub],i)=>`
        <div class="etapa">
          <div class="eb" style="width:${Math.max(n/max*55, 6)}%;opacity:${1-i*0.15}"><b>${n}</b></div>
          <div class="et"><b>${t}</b>${sub?`<span>${sub}</span>`:''}</div>
        </div>`).join('')}
      </div>
      <div class="det" style="margin-top:10px">De las ${leads.length} personas: <b>${enCurso.length}</b> siguen decidiendo y <b>${perdidos.length}</b> no se matricularon.</div>
      <h3 style="margin-top:22px">Solicitudes de información por mes${canal?' ('+canal+')':''}</h3>
      <div class="graf" style="height:120px">${solMes.map(x=>`<div class="gcol">
        <div class="par"><div><div class="gval">${x.n}</div><span style="height:${Math.round(x.n/maxSol*70)}px;background:var(--accent)"></span></div>
        <div><div class="gval">${x.m}</div><span style="height:${Math.round(x.m/maxSol*70)}px;background:var(--ok)"></span></div></div>
        <div class="gmes ${x.k===mesKey(0)?'actual':''}">${nombreMes(x.k).slice(0,3)}</div></div>`).join('')}</div>
      <div class="leyenda" style="margin-top:6px"><span><i style="background:var(--accent)"></i>Pidieron información</span><span><i style="background:var(--ok)"></i>De ellos, se matricularon</span></div>
    </div>
    <div class="card">
      <h3>Por qué no se matriculan</h3>
      ${motivosOrd.length ? `<div class="origen">${motivosOrd.map(([m,n])=>`<div class="fila"><div class="cab"><span>${esc(m)}</span><b>${n}</b></div>
        <div class="doble"><span class="m" style="width:${n/maxMot*100}%;background:var(--bad)"></span></div></div>`).join('')}</div>` : '<div class="vacio">Nadie perdido en este periodo.</div>'}
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <h3>Por canal (${PERIODOS[p].toLowerCase()})</h3>
    <div class="tabla-wrap"><table><thead><tr><th>Canal</th><th>Pidieron información</th><th>Clase de prueba</th><th>Matrículas</th><th>Conversión</th><th>Cuotas activas</th></tr></thead>
    <tbody>${porCanal.map(c=>`<tr style="cursor:pointer" onclick="ui.canal='${c.o}';render()"><td><b>${c.o}</b></td><td>${c.l}</td><td>${c.pr}</td><td>${c.m}</td>
      <td><div class="conv"><div class="barra"><span style="width:${pctDe(c.m,c.l)}%"></span></div>${pctDe(c.m,c.l)} %</div></td><td>${eur(c.eur)}/mes</td></tr>`).join('')}</tbody></table></div>
  </div>
  <div class="card" style="margin-top:16px">
    <h3>Interesados en curso (${interes.length})</h3>
    ${interes.length ? interes.map(a=>{ const pr=ultimaPrueba(a.id); const d=pr?diasDesde(pr.fecha):null;
      const sit = !pr ? 'Sin clase de prueba agendada' : d<0 ? 'Clase de prueba en '+(-d)+' días' : d===0 ? 'Clase de prueba hoy' : 'Hizo la clase de prueba hace '+d+(d===1?' día':' días');
      return `<div class="tarea"><span class="chip c-Seguimiento">${a.origen}</span>
        <div class="info"><div class="nom" onclick="abrirFicha(${a.id})">${esc(a.nombre)} <span class="i-${a.idioma}" style="font-weight:400;font-size:13px">${bandera(a.idioma)}${a.idioma} ${a.nivel}</span></div>
        <div class="txt">Pidió información el ${fmtFecha(fechaInfo(a))} · ${sit}</div></div>
        ${waLink(a, `Hola ${nombrePila(a)}, te escribimos de Trilingua por las clases de ${a.idioma.toLowerCase()}. ¿Te reservamos plaza en el grupo de ${a.horario}?`)}</div>`; }).join('') : '<div class="vacio">No hay interesados pendientes.</div>'}
  </div>`;
}

const PLAZAS_GRUPO = 8;
function vistaGrupos(){
  const mapa = {};
  db.alumnos.filter(a=>a.modalidad==='Grupo' && (a.estado==='activo'||a.estado==='interesado')).forEach(a=>{
    const k = a.idioma+'|'+a.nivel+'|'+a.horario;
    (mapa[k] = mapa[k] || {idioma:a.idioma, nivel:a.nivel, horario:a.horario, cuota:a.cuota, activos:[], interesados:[]});
    (a.estado==='activo' ? mapa[k].activos : mapa[k].interesados).push(a);
  });
  const grupos = Object.values(mapa).sort((x,y)=>IDIOMAS.indexOf(x.idioma)-IDIOMAS.indexOf(y.idioma) || x.nivel.localeCompare(y.nivel));
  const ocupadas = grupos.reduce((s,g)=>s+g.activos.length,0), totales = grupos.length*PLAZAS_GRUPO;
  const ingresos = grupos.reduce((s,g)=>s+g.activos.reduce((x,a)=>x+a.cuota,0),0);
  const potencial = grupos.reduce((s,g)=>s+(PLAZAS_GRUPO-g.activos.length)*g.cuota,0);
  const indiv = db.alumnos.filter(a=>a.modalidad!=='Grupo' && a.estado==='activo').sort((a,b)=>a.idioma.localeCompare(b.idioma));
  const chip = a => `<span class="${a.estado==='interesado'?'int':''}" onclick="abrirFicha(${a.id})">${esc(a.nombre.split(' ').slice(0,2).join(' '))}${a.estado==='interesado'?' (interesado)':''}</span>`;
  return `
  <div class="kpis">
    <div class="card kpi"><div class="etq">Grupos abiertos</div><div class="valor">${grupos.length}</div><div class="det">Máximo ${PLAZAS_GRUPO} alumnos por grupo</div></div>
    <div class="card kpi"><div class="etq">Ocupación de los grupos</div><div class="valor">${totales?Math.round(ocupadas/totales*100):0} %</div><div class="det">${ocupadas} de ${totales} plazas ocupadas</div></div>
    <div class="card kpi"><div class="etq">Ingresos de grupos</div><div class="valor">${eur(ingresos)}</div><div class="det">al mes con la ocupación actual</div></div>
    <div class="card kpi"><div class="etq">Si se llenan las plazas libres</div><div class="valor">+${eur(potencial)}</div><div class="det">al mes más (${totales-ocupadas} plazas libres)</div></div>
  </div>
  <h2>Grupos</h2>
  <div class="grupos">${grupos.map(g=>{
    const n=g.activos.length, pct=Math.round(n/PLAZAS_GRUPO*100), clase = pct>=75?'lleno':pct>=40?'medio':'bajo';
    return `<div class="card grupo">
      <h3 class="i-${g.idioma}">${bandera(g.idioma)}${g.idioma} ${g.nivel}</h3><div class="hor">${esc(g.horario)} · ${eur(g.cuota)}/mes</div>
      <div class="ocup"><span>${n} de ${PLAZAS_GRUPO} plazas</span><b>${eur(n*g.cuota)}/mes</b></div>
      <div class="barra ${clase}"><span style="width:${pct}%"></span></div>
      <div class="ocup" style="color:var(--muted)"><span>${PLAZAS_GRUPO-n} ${PLAZAS_GRUPO-n===1?'plaza libre':'plazas libres'}</span><span>+${eur((PLAZAS_GRUPO-n)*g.cuota)} posibles</span></div>
      <div class="nombres">${g.activos.map(chip).join('')}${g.interesados.map(chip).join('')}</div>
    </div>`;}).join('')}</div>
  <h2 style="margin-top:24px">Clases particulares y online (${indiv.length})</h2>
  <div class="tabla-wrap"><table><thead><tr><th>Alumno</th><th>Idioma</th><th>Modalidad · horario</th><th>Cuota</th></tr></thead>
  <tbody>${indiv.map(a=>`<tr onclick="abrirFicha(${a.id})"><td><b>${esc(a.nombre)}</b></td><td class="i-${a.idioma}">${bandera(a.idioma)}${a.idioma} ${a.nivel}</td><td>${a.modalidad} · ${esc(a.horario)}</td><td>${eur(a.cuota)}</td></tr>`).join('')}</tbody></table></div>`;
}

function tareaHTML(t){
  let boton = '';
  if(t.accion==='pagar') boton = `<button class="btn" onclick="marcarPagado(${t.pagoId})">Marcar cobrado</button>`;
  if(t.accion==='hecho') boton = `<button class="btn sec" onclick="completarTarea('${t.id}',${t.a.id})">Hecho</button>`;
  return `<div class="tarea"><span class="chip c-${t.tipo}">${t.tipo}</span>
    <div class="info"><div class="nom" onclick="abrirFicha(${t.a.id})">${esc(t.a.nombre)} <span class="i-${t.a.idioma}" style="font-weight:400;font-size:13px">${bandera(t.a.idioma)}${t.a.idioma} ${t.a.nivel}</span></div>
    <div class="txt">${esc(t.texto)} · ${esc(t.a.telefono)}</div></div>${t.msg?waLink(t.a,t.msg):''}${boton}</div>`;
}

      (!q || norm(a.nombre+' '+a.email+' '+a.telefono.replace(/ /g,'')+' '+a.telefono).includes(norm(q))) &&
      (!ui.fIdioma || a.idioma===ui.fIdioma) && (!ui.fEstado || a.estado===ui.fEstado))
    .sort((a,b)=>a.nombre.localeCompare(b.nombre));

    <tbody>${lista.map(a=>{ const u=ultimoContacto(a.id); const deuda=db.pagos.some(p=>p.alumnoId===a.id&&p.estado==='pendiente');

      <td class="i-${a.idioma}">${bandera(a.idioma)}${a.idioma} ${a.nivel}</td><td>${a.modalidad} · ${esc(a.horario)}</td><td>${eur(a.cuota)}</td>
      <td><span class="chip e-${a.estado}">${a.estado}</span></td>
      <td>${u?fmtFecha(u.fecha)+'<br><span style="color:var(--muted);font-size:13px">'+u.tipo+'</span>':''}</td></tr>`;}).join('')
      || '<tr><td colspan="6" class="vacio">No hay alumnos con esos filtros.</td></tr>'}</tbody>
  </table></div>`;
}

function crearAlumno(){
  const d = leerCampos('n-');
  if(!d.nombre){ aviso('Falta el nombre'); return; }
  const estado = document.getElementById('n-estado').value;
  const prueba = document.getElementById('n-prueba').value;
  const a = Object.assign({id:db.seq++, estado, alta: estado==='activo'?hoyISO:'', fechaBaja:'', motivoBaja:''}, d);
  db.alumnos.push(a);
  db.contactos.push({id:db.seq++, alumnoId:a.id, fecha:hoyISO, tipo:'Visita', nota:'Alta en el CRM'});
  if(prueba) db.contactos.push({id:db.seq++, alumnoId:a.id, fecha:prueba, tipo:'Clase de prueba', nota: prueba>hoyISO?'Clase de prueba programada':'Clase de prueba'});
  if(estado==='activo') db.pagos.push({id:db.seq++, alumnoId:a.id, mes:mesKey(0), importe:a.cuota, estado:'pendiente'});
  guardar(); aviso('Alumno guardado'); ui.vista='alumnos'; render(); abrirFicha(a.id);
}

/* ================== Ficha ================== */
function abrirFicha(id){ ui.fichaId=id; pintarFicha(); document.getElementById('modal').classList.add('abierto'); }
function cerrarFicha(){ ui.fichaId=null; document.getElementById('modal').classList.remove('abierto'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') cerrarFicha(); });

function pintarFicha(){
  const a = alumno(ui.fichaId); if(!a) return;
  const pagos = pagosDe(a.id), cs = contactosDe(a.id);
  const deuda = pagos.filter(p=>p.estado==='pendiente').reduce((s,p)=>s+p.importe,0);
  let acciones = '';
  if(a.estado==='interesado') acciones = `<button class="btn" onclick="matricular(${a.id})">Matricular hoy</button><input id="motivo" placeholder="Motivo si no se matricula" style="flex:1;min-width:200px"><button class="btn sec" onclick="marcarPerdido(${a.id})">Marcar como perdido</button>`;
  if(a.estado==='perdido') acciones = `<span style="color:var(--muted);font-size:14px">No se matriculó (${fmtFecha(a.fechaBaja)}): ${esc(a.motivoBaja)}</span><button class="btn" onclick="recuperar(${a.id})">Volver a interesado</button>`;
  if(a.estado==='activo') acciones = `<input id="motivo" placeholder="Motivo de la baja" style="flex:1;min-width:200px"><button class="btn peligro" onclick="darBaja(${a.id})">Dar de baja</button>`;
  if(a.estado==='baja') acciones = `<span style="color:var(--muted);font-size:14px">Baja el ${fmtFecha(a.fechaBaja)}: ${esc(a.motivoBaja)}</span><button class="btn" onclick="matricular(${a.id})">Reactivar</button>`;
  document.getElementById('ficha').innerHTML = `
    <div class="ficha-cab"><h2>${esc(a.nombre)}</h2><span class="chip e-${a.estado}">${a.estado}</span>
      ${waLink(a, `Hola ${nombrePila(a)}, te escribimos de Trilingua. `)}
      <button class="btn sec" onclick="cerrarFicha()">Cerrar</button></div>
    <div style="color:var(--muted);font-size:13px;margin-bottom:14px">${a.alta?'Alumno desde '+fmtFecha(a.alta)+' · ':''}${deuda?'<b style="color:var(--bad)">Debe '+eur(deuda)+'</b>':'Sin recibos pendientes'}</div>
    ${camposAlumno(a,'f-')}
    <div class="fila-acc"><button class="btn" onclick="guardarFicha(${a.id})">Guardar cambios</button>${acciones}</div>

    <div class="seccion"><h3>Pagos</h3>
      ${pagos.length?`<table><thead><tr><th>Mes</th><th>Importe</th><th>Estado</th><th></th></tr></thead><tbody>
      ${pagos.map(p=>`<tr style="cursor:default"><td>${fmtMes(p.mes)}</td><td>${eur(p.importe)}</td>
        <td><span class="chip ${p.estado==='pagado'?'e-activo':'c-Cobro'}">${p.estado}</span></td>
        <td>${p.estado==='pendiente'?`<button class="btn" onclick="marcarPagado(${p.id})">Marcar cobrado</button>`:''}</td></tr>`).join('')}
      </tbody></table>`:'<div class="vacio">Sin pagos registrados.</div>'}
    </div>

    <div class="seccion"><h3>Historial de contactos y visitas</h3>
      <div class="filtros">
        <select id="c-tipo">${TIPOS_CONTACTO.map(t=>`<option>${t}</option>`).join('')}</select>
        <input id="c-fecha" type="date" value="${hoyISO}" style="flex:0">
        <input id="c-nota" placeholder="Qué se ha hablado o hecho">
        <button class="btn" onclick="anadirContacto(${a.id})">Añadir</button>
      </div>
      ${cs.length?`<ul class="hist">${cs.map(c=>`<li><span class="f">${fmtFecha(c.fecha)}</span><span class="t">${c.tipo}</span><span>${esc(c.nota)}</span></li>`).join('')}</ul>`:'<div class="vacio">Sin contactos.</div>'}
    </div>`;
}

function refrescar(){ guardar(); render(); if(ui.fichaId) pintarFicha(); }

function guardarFicha(id){
  const d = leerCampos('f-'); if(!d.nombre){ aviso('Falta el nombre'); return; }
  Object.assign(alumno(id), d); refrescar(); aviso('Cambios guardados');
}
function marcarPagado(pid){
  const p = db.pagos.find(x=>x.id===pid); if(!p) return;
  p.estado='pagado'; refrescar(); aviso('Recibo marcado como cobrado');
}
function completarTarea(tid, aid){
  db.hechas.push(tid);
  const t = tid.split('-')[0];
  const nota = {prueba:'Llamada de seguimiento tras la clase de prueba', faltas:'Llamada por faltas seguidas', examen:'Confirmada inscripción al examen'}[t] || 'Tarea completada';
  db.contactos.push({id:db.seq++, alumnoId:aid, fecha:hoyISO, tipo:'Llamada', nota});
  refrescar(); aviso('Tarea completada y anotada en el historial');
}
function anadirContacto(id){
  const tipo = document.getElementById('c-tipo').value, fecha = document.getElementById('c-fecha').value || hoyISO, nota = document.getElementById('c-nota').value.trim();
  db.contactos.push({id:db.seq++, alumnoId:id, fecha, tipo, nota: nota || tipo});
  refrescar(); aviso('Contacto añadido');
}
function matricular(id){
  const a = alumno(id);
  a.estado='activo'; a.alta=hoyISO; a.fechaBaja=''; a.motivoBaja=''; a.faltas=0;
  if(!db.pagos.some(p=>p.alumnoId===id && p.mes===mesKey(0))) db.pagos.push({id:db.seq++, alumnoId:id, mes:mesKey(0), importe:a.cuota, estado:'pendiente'});
  db.contactos.push({id:db.seq++, alumnoId:id, fecha:hoyISO, tipo:'Visita', nota:'Se matricula en '+a.idioma+' '+a.nivel});
  refrescar(); aviso(a.nombre+' matriculado');
}
function marcarPerdido(id){
  const a = alumno(id), motivo = document.getElementById('motivo').value.trim() || 'Sin motivo indicado';
  a.estado='perdido'; a.fechaBaja=hoyISO; a.motivoBaja=motivo;
  db.contactos.push({id:db.seq++, alumnoId:id, fecha:hoyISO, tipo:'Llamada', nota:'No se matricula. Motivo: '+motivo});
  refrescar(); aviso('Marcado como perdido');
}
function recuperar(id){
  const a = alumno(id); a.estado='interesado'; a.fechaBaja=''; a.motivoBaja='';
  db.contactos.push({id:db.seq++, alumnoId:id, fecha:hoyISO, tipo:'Llamada', nota:'Vuelve a interesarse'});
  refrescar(); aviso('Vuelve a interesado');
}
function darBaja(id){
  const a = alumno(id), motivo = document.getElementById('motivo').value.trim() || 'Sin motivo indicado';
  a.estado='baja'; a.fechaBaja=hoyISO; a.motivoBaja=motivo;
  db.contactos.push({id:db.seq++, alumnoId:id, fecha:hoyISO, tipo:'Llamada', nota:'Baja. Motivo: '+motivo});
  refrescar(); aviso('Baja registrada');
}

document.getElementById('hoy').textContent = HOY.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
render();
</script>
</body>
</html>
